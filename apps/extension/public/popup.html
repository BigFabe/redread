<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>redread</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><header><div class="brand"><img src="icons/48.png" alt="" width="29" height="29">redread<span>.</span></div><button id="settings" class="quiet" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="connection" hidden>⚙</button></header>
<main>
<section id="connection">
<form id="connect-form"><label for="server">Address of your redread web app</label><input id="server" type="url" placeholder="http://your-host:3210" autocomplete="url" spellcheck="false" required autofocus><button id="connect" class="primary" type="submit">Save &amp; connect</button></form>
<p id="connection-status" class="status" role="status" aria-live="polite"></p>
<div id="connected-actions" hidden><button id="back" class="secondary" type="button">Back to article</button><button id="logout" class="text-link" type="button">Log out</button></div>
</section>
<section id="article-view" hidden><section class="article"><p id="source" class="source">Current page</p><h1 id="title">Loading article…</h1><div class="sound" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><label id="voice-field" hidden>Voice<select id="voice" aria-label="Voice"><option value="">Automatic / default voice</option></select></label><button id="submit" class="primary" disabled>Make article listenable ↗</button><p id="status" class="status" role="status" aria-live="polite">One moment…</p><a id="open" class="text-link" target="_blank" rel="noreferrer" hidden>Open article in redread ↗</a></section>
</main><script src="popup.js"></script></body></html>
