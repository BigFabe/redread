services:
  web:
    build: .
    image: redread:local
    container_name: redread
    networks:
      - default
      - lsio
    env_file: .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3210}
    volumes:
      - redread-data:/data
    restart: unless-stopped
  worker:
    image: redread:local
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    volumes:
      - redread-data:/data
    restart: unless-stopped
volumes:
  redread-data:

networks:
  lsio:
    external: true
