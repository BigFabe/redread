name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web build and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REDREAD_ENV_FILE: ''
      DATA_DIR: ${{ runner.temp }}/redread-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_PLATFORM: android-35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build development APK with the runner's JDK 17 and Android SDK
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./apps/android/build.sh
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: redread-android-${{ github.run_number }}
          path: apps/android/build/redread.apk
          if-no-files-found: error
          retention-days: 14
